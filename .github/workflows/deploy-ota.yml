name: Deploy Mobile OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'OTA Update Summary Message'
        required: true
        default: 'Production bugfixes and stability update'
      channel:
        description: 'EAS Update Channel'
        required: true
        default: 'production'

concurrency:
  group: deploy-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Publish EAS Update
        working-directory: eagle-pathway-mobile
        run: eas update --channel ${{ github.event.inputs.channel }} --message "${{ github.event.inputs.message }}"
